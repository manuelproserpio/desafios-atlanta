[build]
  publish = "."

# Archivos internos del proyecto: no deben verse en el sitio publicado.
[[redirects]]
  from = "/datos/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/herramientas/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/informe_validacion.txt"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/LEEME.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
